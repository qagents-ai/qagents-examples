<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Application execution and verification</title>
<desc id="desc">Typed input and an explicitly selected model enter the agent. Tools may request approval before writing a local destination. A separate verifier checks the resulting evidence and artifacts, including declined actions.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#506589" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="470" rx="16" fill="#f5f7fc"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="40" y="46" fill="#253266" font-size="25" font-weight="600">Application code checks what the agent did.</text><rect x="40" y="112" width="200" height="75" rx="9" fill="white" stroke="#b8c6dc"/><text x="58" y="143" fill="#253266" font-size="20" font-weight="600">Task input</text><text x="58" y="170" fill="#4d5f76" font-size="16" font-weight="400">Validated schema</text><rect x="40" y="254" width="200" height="80" rx="9" fill="white" stroke="#b8c6dc"/><text x="58" y="285" fill="#253266" font-size="20" font-weight="600">Model selection</text><text x="58" y="312" fill="#4d5f76" font-size="16" font-weight="400">Fixture or provider</text><rect x="310" y="165" width="200" height="100" rx="9" fill="white" stroke="#b8c6dc"/><text x="328" y="196" fill="#253266" font-size="20" font-weight="600">QAgents agent</text><text x="328" y="223" fill="#4d5f76" font-size="16" font-weight="400">Tools and specialists</text><rect x="580" y="112" width="245" height="75" rx="9" fill="white" stroke="#b8c6dc"/><text x="598" y="143" fill="#253266" font-size="20" font-weight="600">Review decision</text><text x="598" y="170" fill="#4d5f76" font-size="16" font-weight="400">Approve or decline</text><rect x="580" y="289" width="245" height="75" rx="9" fill="white" stroke="#b8c6dc"/><text x="598" y="320" fill="#253266" font-size="20" font-weight="600">Local destination</text><text x="598" y="347" fill="#4d5f76" font-size="16" font-weight="400">Evidence of action</text><rect x="900" y="200" width="255" height="100" rx="9" fill="white" stroke="#b8c6dc"/><text x="918" y="231" fill="#253266" font-size="20" font-weight="600">Application verifier</text><text x="918" y="258" fill="#4d5f76" font-size="16" font-weight="400">Report and artifacts</text><path d="M240 150H275V195H310" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M240 294H275V235H310" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M510 200H545V150H580" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M702 187V289" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M510 235H546V250H900" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M825 326H865V275H900" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M825 150H865V224H900" fill="none" stroke="#506589" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="717" y="220" fill="#00766d" font-size="15" font-weight="400">Approved</text><text x="882" y="168" fill="#4d5f76" font-size="15" font-weight="400">Declined</text><text x="40" y="424" fill="#4d5f76" font-size="18" font-weight="400">The verifier reads application evidence. A valid output schema alone does not establish correctness.</text></g></svg>
