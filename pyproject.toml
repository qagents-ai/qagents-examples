[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qagents-examples"
version = "0.1.0"
description = "Runnable agent use cases implemented with QAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["qagents>=0.2,<0.4", "pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "hatchling>=1.27"]
anthropic = ["qagents[anthropic]"]

[project.scripts]
qagents-examples = "qagents_examples.cli:main"

[tool.uv.sources]
qagents = { path = "../qagents", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/qagents_examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
